<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
    </head>
    <body>
        <div id="main">
            <div id="sideText" class="monsieur"><p>into the groove</p></div>
            <div id="mpc"> 
                <div id="innerScreen">
                    <p id="lcdText"></p>
                    <p id="delayText">DelayAmt: 240ms</p>
                    <p id="fbText">FeedbackAmt: 75%</p>
                    <p id="wetText">Wet: 50%</p>
                    <p id="reverbText">ReverbTime: 0.3</p>
                    <p id="bankText"></p>
                </div>
                <div id ="configButtons">
                    <button id="bankButton" onclick="switchBank()">bank</button>
                    <button id="bankButton" onclick="goToBank(1)">1</button>
                    <button id="bankButton" onclick="goToBank(2)">2</button>
                    <button id="bankButton" onclick="goToBank(3)">3</button>
                    <button id="bankButton" onclick="goToBank(4)">4</button>
                    <button id="bankButton" onclick="goToBank(5)">5</button>
                </div>
                <div id="sliders">
                    <input id="delayTime" type="range" min="0.01" max="1" step="0.01">
                    <input id="feedback" type="range" min="0.01" max="0.99" step="0.01">
                    <input id="wetSlider" type="range" min="0" max="100" step="0.01">
                    <input id="reverbSlider" type="range" min="0" max="10" step="0.01">
                </div>
                <div id="pads">
                </div>
            </div>
        </div>
    </body> 
    <script src="mpc-instrument.js"></script>   
</html>
